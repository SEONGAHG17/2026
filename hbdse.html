<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C:\> Isometric_918_Flowers.exe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --bg-color: #050505;
      --term-green: #00ff66;
      --term-dim: #008833;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .crt-screen {
      width: 760px;
      height: 560px;
      background: #000;
      border: 4px solid var(--term-dim);
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px dashed var(--term-dim);
      padding-bottom: 8px;
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    canvas {
      background: #09090e;
      border: 2px solid var(--term-green);
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
    }

    .dialogue-box {
      margin-top: 10px;
      border: 2px solid var(--term-green);
      background: rgba(0, 20, 0, 0.9);
      padding: 12px;
      height: 85px;
      font-size: 1.25rem;
      line-height: 1.3;
      position: relative;
    }

    .guide {
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 0.85rem;
      color: var(--term-dim);
    }
  </style>
</head>
<body>

<div class="crt-screen">
  <div class="header">
    <span id="posDisplay">ISOMETRIC WORLD [9000x9000]</span>
    <span id="flowerCount" style="color: #ffcc00;">[FLOWER: 0 / 918]</span>
  </div>

  <canvas id="gameCanvas" width="720" height="360"></canvas>

  <div class="dialogue-box">
    <div id="dialogueText">아이소메트릭 쿼터뷰 맵 탐험 중! 꽃에 다가가 [Z] 또는 [Space]를 누르세요.</div>
    <div class="guide">이동: 방향키(WASD) / 채집: Z 또는 Space</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq = 440, duration = 0.04) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0.03;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // 1. 9000 x 9000 월드 설정
  const WORLD = {
    width: 9000,
    height: 9000
  };

  // 2. 플레이어 (맵 중앙 4500, 4500에서 시작)
  let player = {
    x: 4500,
    y: 4500,
    speed: 6,
    emotion: null,
    emotionTimer: 0
  };

  // 3. 꽃 918개 + 마진 간격 생성
  let flowers = [];
  const totalTarget = 918;
  const MIN_MARGIN = 50;
  let collectedCount = 0;

  const flowerColors = ['#ff3366', '#ffcc00', '#33aaff', '#ff77ff', '#33ffaa'];

  function generateFlowers() {
    let attempts = 0;
    while (flowers.length < totalTarget && attempts < 150000) {
      attempts++;
      let candidateX = Math.floor(Math.random() * (WORLD.width - 300)) + 150;
      let candidateY = Math.floor(Math.random() * (WORLD.height - 300)) + 150;

      let isTooClose = false;
      for (let f of flowers) {
        let dist = Math.hypot(candidateX - f.x, candidateY - f.y);
        if (dist < MIN_MARGIN) {
          isTooClose = true;
          break;
        }
      }

      if (!isTooClose) {
        flowers.push({
          id: flowers.length,
          x: candidateX,
          y: candidateY,
          collected: false,
          color: flowerColors[flowers.length % flowerColors.length]
        });
      }
    }
  }

  generateFlowers();

  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'z'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
    if ((e.key === 'z' || e.key === ' ' || e.key.toLowerCase() === 'z')) {
      tryGatherSingleFlower();
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function setDialogue(text) {
    document.getElementById('dialogueText').innerText = text;
  }

  // 꽃 단일 수집
  function tryGatherSingleFlower() {
    let nearestFlower = null;
    let minDistance = 50;

    for (let f of flowers) {
      if (!f.collected) {
        let dist = Math.hypot(player.x - f.x, player.y - f.y);
        if (dist < minDistance) {
          minDistance = dist;
          nearestFlower = f;
        }
      }
    }

    if (nearestFlower) {
      nearestFlower.collected = true;
      collectedCount++;

      document.getElementById('flowerCount').innerText = `[FLOWER: ${collectedCount} / ${totalTarget}]`;
      playBeep(880, 0.05);

      const emotions = ['♥', '✨', '!', '🎵'];
      player.emotion = emotions[Math.floor(Math.random() * emotions.length)];
      player.emotionTimer = 35;

      if (collectedCount >= totalTarget) {
        setDialogue("🎉 9000x9000 맵의 918송이 꽃을 완벽 채집했습니다! 최고로 행복한 생일 보내!! ✨");
      } else {
        setDialogue(`꽃 1송이를 채집했습니다! "${player.emotion}" (누적: ${collectedCount} / ${totalTarget})`);
      }
    }
  }

  function update() {
    let dx = 0, dy = 0;
    if (keys['arrowleft'] || keys['a']) dx = -player.speed;
    if (keys['arrowright'] || keys['d']) dx = player.speed;
    if (keys['arrowup'] || keys['w']) dy = -player.speed;
    if (keys['arrowdown'] || keys['s']) dy = player.speed;

    player.x += dx;
    player.y += dy;

    player.x = Math.max(30, Math.min(WORLD.width - 30, player.x));
    player.y = Math.max(30, Math.min(WORLD.height - 30, player.y));

    document.getElementById('posDisplay').innerText = `ISO WORLD [POS: ${Math.floor(player.x)}, ${Math.floor(player.y)}]`;
  }

  // ★ 아이소메트릭 보정 좌표 변환 함수 (카메라 중심 기준)
  function toScreen(worldX, worldY) {
    let relX = worldX - player.x;
    let relY = worldY - player.y;

    // 2:1 비율 아이소메트릭 변환
    let screenX = (relX - relY) * 0.8 + canvas.width / 2;
    let screenY = (relX + relY) * 0.4 + canvas.height / 2;

    return { x: screenX, y: screenY };
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 깊이 정렬용 렌더링 리스트
    let renderList = [];

    // 플레이어 주변 범위 안의 꽃만 필터링
    flowers.forEach(f => {
      if (!f.collected) {
        let dist = Math.hypot(player.x - f.x, player.y - f.y);
        if (dist < 600) { // 주변 범위 600px 내만 렌더링
          renderList.push({ type: 'flower', x: f.x, y: f.y, obj: f });
        }
      }
    });

    // 플레이어 추가
    renderList.push({ type: 'player', x: player.x, y: player.y });

    // Y축 깊이 정렬 (앞뒤 레이어 오름차순 정렬)
    renderList.sort((a, b) => (a.x + a.y) - (b.x + b.y));

    // 아이소메트릭 사선 격자 배경
    ctx.strokeStyle = '#151525';
    ctx.lineWidth = 1;
    for (let rx = -500; rx <= 500; rx += 50) {
      let p1 = toScreen(player.x + rx, player.y - 500);
      let p2 = toScreen(player.x + rx, player.y + 500);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
    for (let ry = -500; ry <= 500; ry += 50) {
      let p1 = toScreen(player.x - 500, player.y + ry);
      let p2 = toScreen(player.x + 500, player.y + ry);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }

    // 렌더링 루프
    renderList.forEach(item => {
      let pos = toScreen(item.x, item.y);

      if (pos.x > -50 && pos.x < canvas.width + 50 && pos.y > -50 && pos.y < canvas.height + 50) {
        if (item.type === 'flower') {
          let f = item.obj;
          // 입체 픽셀 꽃
          ctx.fillStyle = f.color;
          ctx.fillRect(pos.x - 5, pos.y - 12, 10, 10);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(pos.x - 2, pos.y - 9, 4, 4);
          ctx.fillStyle = '#228822'; // 줄기
          ctx.fillRect(pos.x - 1, pos.y - 2, 2, 6);
        } else if (item.type === 'player') {
          // 입체 난쟁이 캐릭터
          ctx.fillStyle = '#ff5555'; // 빨간 모자/옷
          ctx.fillRect(pos.x - 8, pos.y - 20, 16, 16);
          ctx.fillStyle = '#ffcc99'; // 얼굴
          ctx.fillRect(pos.x - 6, pos.y - 15, 12, 10);
          ctx.fillStyle = '#000000'; // 눈
          ctx.fillRect(pos.x - 4, pos.y - 12, 2, 2);
          ctx.fillRect(pos.x + 2, pos.y - 12, 2, 2);

          // 감정 이모션 표시
          if (player.emotionTimer > 0) {
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px VT323';
            ctx.fillText(player.emotion, pos.x + 10, pos.y - 26);
            player.emotionTimer--;
          }
        }
      }
    });
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
