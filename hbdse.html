<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C:\> Undertale_Birthday_Quest.exe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --bg-color: #050505;
      --term-green: #00ff66;
      --term-dim: #008833;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .crt-screen {
      width: 720px;
      height: 540px;
      background: #000;
      border: 4px solid var(--term-dim);
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px dashed var(--term-dim);
      padding-bottom: 8px;
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    canvas {
      background: #0d0d12;
      border: 2px solid var(--term-green);
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
    }

    .dialogue-box {
      margin-top: 10px;
      border: 2px solid var(--term-green);
      background: rgba(0, 20, 0, 0.9);
      padding: 12px;
      height: 90px;
      font-size: 1.3rem;
      line-height: 1.3;
      position: relative;
    }

    .guide {
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 0.9rem;
      color: var(--term-dim);
    }
  </style>
</head>
<body>

<div class="crt-screen">
  <div class="header">
    <span>C:\QUEST\FLOWER_GARDEN.EXE</span>
    <span id="flowerCount">[FLOWER: 0 / 3]</span>
  </div>

  <canvas id="gameCanvas" width="680" height="360"></canvas>

  <div class="dialogue-box">
    <div id="dialogueText">방향키(↑ ↓ ← →)로 움직여서 맵을 탐색하고, 꽃에게 다가가 [Z] 또는 [Space]를 누르세요!</div>
    <div class="guide" id="guideText">조작: 방향키 이동 / 상호작용: Z 또는 Space</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // 오디오 비프음 생성기
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq = 440, duration = 0.05, type = 'square') {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = 0.03;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // 게임 상태: EXPLORE(탐험), EMOTION(감정표출), MINIGAME(미니게임), DIALOGUE(대화), ENDING(엔딩)
  let gameState = 'EXPLORE';

  // 플레이어 (난쟁이) 객체
  let player = {
    x: 100,
    y: 180,
    size: 24,
    speed: 2.5,
    dir: 'DOWN',
    emotion: null,
    emotionTimer: 0
  };

  // 꽃 객체 리스트 (맵에 흩어져 있음)
  let flowers = [
    { id: 1, x: 250, y: 100, name: '장미', collected: false, color: '#ff3366' },
    { id: 2, x: 450, y: 220, name: '해바라기', collected: false, color: '#ffcc00' },
    { id: 3, x: 300, y: 280, name: '마법의 꽃', collected: false, color: '#33aaff' }
  ];

  let collectedCount = 0;
  let activeFlower = null; // 현재 상호작용 중인 꽃

  // 입력 키 관리
  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'z'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
    if ((e.key === 'z' || e.key === ' ' || e.key.toLowerCase() === 'z') && gameState === 'EXPLORE') {
      checkInteraction();
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // 텍스트 출력우선 갱신
  function setDialogue(text) {
    document.getElementById('dialogueText').innerText = text;
  }

  // 1. 맵 탐험 및 상호작용 체크
  function checkInteraction() {
    for (let f of flowers) {
      if (!f.collected) {
        let dist = Math.hypot(player.x - f.x, player.y - f.y);
        if (dist < 45) {
          activeFlower = f;
          triggerEmotionAndGather();
          return;
        }
      }
    }
  }

  // 2. 채집 시 감정(이모션) 표현 연출
  function triggerEmotionAndGather() {
    gameState = 'EMOTION';
    const emotions = ['♥', '✨', '!', '🎵'];
    player.emotion = emotions[Math.floor(Math.random() * emotions.length)];
    player.emotionTimer = 60; // 약 1초간 유지
    playBeep(587.33, 0.1);

    setDialogue(`난쟁이가 ${activeFlower.name}을(를) 발견하고 설레는 눈빛을 보낸다! "${player.emotion}"`);

    setTimeout(() => {
      // 3. 확률적 미니게임 등장 (50% 확률로 미니게임, 아니면 즉시 획득)
      if (Math.random() < 0.5) {
        startMinigame();
      } else {
        completeFlowerGather("운좋게 한 번에 쏙 뽑았다!");
      }
    }, 1200);
  }

  // 확률적 미니게임 (회피 게임)
  let mgHeart = { x: 340, y: 220, size: 16 };
  let mgThorns = [];
  let mgTimer = 0;

  function startMinigame() {
    gameState = 'MINIGAME';
    mgHeart = { x: 340, y: 220, size: 16 };
    mgThorns = [];
    mgTimer = 180; // 약 3초간 버티기
    setDialogue(`앗! ${activeFlower.name}의 가시 방어 시스템 작동! 날아오는 가시를 피해라!`);
  }

  function updateMinigame() {
    // 미니게임 키 이동
    if (keys['arrowleft'] || keys['a']) mgHeart.x -= 4;
    if (keys['arrowright'] || keys['d']) mgHeart.x += 4;
    if (keys['arrowup'] || keys['w']) mgHeart.y -= 4;
    if (keys['arrowdown'] || keys['s']) mgHeart.y += 4;

    // 영역 제한
    mgHeart.x = Math.max(220, Math.min(460, mgHeart.x));
    mgHeart.y = Math.max(120, Math.min(280, mgHeart.y));

    // 가시 생성
    if (Math.random() < 0.15) {
      mgThorns.push({
        x: 220 + Math.random() * 240,
        y: 120,
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 2
      });
    }

    // 가시 이동 및 충돌
    for (let i = mgThorns.length - 1; i >= 0; i--) {
      let t = mgThorns[i];
      t.x += t.vx;
      t.y += t.vy;

      // 하트와 충돌 체크
      if (Math.hypot(t.x - mgHeart.x, t.y - mgHeart.y) < 14) {
        playBeep(150, 0.1);
        // 피격 시 잠시 멈칫하거나 재시도 가능하도록 간단 처리
      }

      if (t.y > 300) mgThorns.splice(i, 1);
    }

    mgTimer--;
    if (mgTimer <= 0) {
      completeFlowerGather("미니게임 돌파 성공! 꽃을 무사히 채집했다!");
    }
  }

  function completeFlowerGather(msg) {
    activeFlower.collected = true;
    collectedCount++;
    document.getElementById('flowerCount').innerText = `[FLOWER: ${collectedCount} / 3]`;
    playBeep(880, 0.2);

    if (collectedCount >= 3) {
      gameState = 'ENDING';
      startEnding();
    } else {
      gameState = 'EXPLORE';
      setDialogue(`${msg} (${collectedCount}/3 완료) 계속 탐색하자.`);
    }
  }

  // 엔딩 연출
  function startEnding() {
    setDialogue("🎉 거대한 3종 꽃다발 완성! 가운데에 생일 촛불을 켰습니다. 생일 진심으로 축하해! ✨");
  }

  // 픽셀 아트 렌더링 (캔버스 드로잉)
  function drawPixelDwarf(x, y) {
    ctx.fillStyle = '#ff5555'; // 모자/옷
    ctx.fillRect(x - 8, y - 12, 16, 16);
    ctx.fillStyle = '#ffcc99'; // 얼굴
    ctx.fillRect(x - 6, y - 8, 12, 10);
    ctx.fillStyle = '#000000'; // 눈
    ctx.fillRect(x - 4, y - 6, 2, 2);
    ctx.fillRect(x + 2, y - 6, 2, 2);

    // 감정 이모션 말풍선 표시
    if (player.emotionTimer > 0) {
      ctx.fillStyle = '#fff';
      ctx.font = '16px VT323';
      ctx.fillText(player.emotion, x + 10, y - 16);
      player.emotionTimer--;
    }
  }

  function drawPixelFlower(f) {
    if (f.collected) return;
    ctx.fillStyle = f.color;
    // 픽셀 꽃 모양
    ctx.fillRect(f.x - 6, f.y - 6, 12, 12);
    ctx.fillStyle = '#fff';
    ctx.fillRect(f.x - 2, f.y - 2, 4, 4);
    ctx.fillStyle = '#228822'; // 줄기
    ctx.fillRect(f.x - 1, f.y + 6, 2, 8);
  }

  // 메인 게임 루프
  function update() {
    if (gameState === 'EXPLORE') {
      let dx = 0, dy = 0;
      if (keys['arrowleft'] || keys['a']) dx = -player.speed;
      if (keys['arrowright'] || keys['d']) dx = player.speed;
      if (keys['arrowup'] || keys['w']) dy = -player.speed;
      if (keys['arrowdown'] || keys['s']) dy = player.speed;

      player.x += dx;
      player.y += dy;

      // 맵 경계 제한
      player.x = Math.max(30, Math.min(650, player.x));
      player.y = Math.max(30, Math.min(330, player.y));
    } else if (gameState === 'MINIGAME') {
      updateMinigame();
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 맵 배경 격자 (레트로 도트 감성)
    ctx.strokeStyle = '#151522';
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 30) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for (let j = 0; j < canvas.height; j += 30) {
      ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    if (gameState === 'EXPLORE' || gameState === 'EMOTION' || gameState === 'MINIGAME') {
      // 꽃들 그리기
      flowers.forEach(f => drawPixelFlower(f));

      // 난쟁이 그리기
      drawPixelDwarf(player.x, player.y);

      // 미니게임 화면 추가 렌더링
      if (gameState === 'MINIGAME') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(220, 120, 240, 160);

        // 가시들
        ctx.fillStyle = '#ff3333';
        mgThorns.forEach(t => {
          ctx.fillRect(t.x - 4, t.y - 4, 8, 8);
        });

        // 하트
        ctx.fillStyle = '#ff3366';
        ctx.fillRect(mgHeart.x - 6, mgHeart.y - 6, 12, 12);
      }
    } else if (gameState === 'ENDING') {
      // 엔딩 꽃다발 아트
      ctx.fillStyle = '#ffcc00';
      ctx.font = '30px VT323';
      ctx.fillText("💐 SUPER BIRTHDAY BOUQUET 💐", 140, 150);
      ctx.fillStyle = '#fff';
      ctx.font = '20px VT323';
      ctx.fillText("생일 축하해! 최고의 하루가 되기를 바랄게!", 160, 200);
    }
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
