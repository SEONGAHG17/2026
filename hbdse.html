<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C:\> Undertale_World_Search.exe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --bg-color: #050505;
      --term-green: #00ff66;
      --term-dim: #008833;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .crt-screen {
      width: 760px;
      height: 560px;
      background: #000;
      border: 4px solid var(--term-dim);
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px dashed var(--term-dim);
      padding-bottom: 8px;
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    canvas {
      background: #09090e;
      border: 2px solid var(--term-green);
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
    }

    .dialogue-box {
      margin-top: 10px;
      border: 2px solid var(--term-green);
      background: rgba(0, 20, 0, 0.9);
      padding: 12px;
      height: 85px;
      font-size: 1.25rem;
      line-height: 1.3;
      position: relative;
    }

    .guide {
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 0.85rem;
      color: var(--term-dim);
    }
  </style>
</head>
<body>

<div class="crt-screen">
  <div class="header">
    <span>WORLD MAP [2000 x 2000]</span>
    <span id="flowerCount" style="color: #ffcc00;">[FLOWER: 0 / 918]</span>
  </div>

  <!-- 화면 카메라 크기: 720 x 360 -->
  <canvas id="gameCanvas" width="720" height="360"></canvas>

  <div class="dialogue-box">
    <div id="dialogueText">거대한 맵을 자유롭게 돌아다니며 918개의 꽃을 수집하세요! [방향키 이동 / Z 채집]</div>
    <div class="guide">카메라 스크롤 / 조작: 방향키, Z 또는 Space</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // Web Audio API 사운드
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq = 440, duration = 0.04) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0.03;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // 1. 거대한 가상 월드 맵 크기 정의
  const WORLD = {
    width: 2000,
    height: 2000
  };

  // 2. 카메라(Viewport) 정의
  let camera = {
    x: 0,
    y: 0,
    width: canvas.width,
    height: canvas.height
  };

  // 3. 난쟁이 플레이어 (월드 좌표계)
  let player = {
    x: 1000, // 맵 중앙에서 시작
    y: 1000,
    size: 20,
    speed: 4,
    emotion: null,
    emotionTimer: 0
  };

  // 4. 거대 맵 전체에 랜덤으로 배치되는 918개의 꽃 데이터 생성
  let flowers = [];
  const totalTarget = 918;
  let collectedCount = 0;

  const flowerColors = ['#ff3366', '#ffcc00', '#33aaff', '#ff77ff', '#33ffaa'];
  for (let i = 0; i < totalTarget; i++) {
    flowers.push({
      id: i,
      x: Math.floor(Math.random() * (WORLD.width - 100)) + 50,
      y: Math.floor(Math.random() * (WORLD.height - 100)) + 50,
      collected: false,
      color: flowerColors[i % flowerColors.length]
    });
  }

  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'z'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
    if ((e.key === 'z' || e.key === ' ' || e.key.toLowerCase() === 'z')) {
      tryGatherFlower();
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function setDialogue(text) {
    document.getElementById('dialogueText').innerText = text;
  }

  // 꽃 채집 로직
  function tryGatherFlower() {
    let found = false;
    for (let f of flowers) {
      if (!f.collected) {
        let dist = Math.hypot(player.x - f.x, player.y - f.y);
        if (dist < 35) { // 주변 꽃 채집
          f.collected = true;
          collectedCount++;
          found = true;
        }
      }
    }

    if (found) {
      document.getElementById('flowerCount').innerText = `[FLOWER: ${collectedCount} / ${totalTarget}]`;
      playBeep(880, 0.05);
      player.emotion = '♥';
      player.emotionTimer = 30;

      if (collectedCount >= totalTarget) {
        setDialogue("🎉 918송이의 꽃다발을 전부 모았습니다! 생일 축하해!! ✨");
      } else {
        setDialogue(`꽃을 채집했습니다! (누적: ${collectedCount} / ${totalTarget})`);
      }
    }
  }

  // 플레이어 이동 및 카메라 추적 연동
  function update() {
    let dx = 0, dy = 0;
    if (keys['arrowleft'] || keys['a']) dx = -player.speed;
    if (keys['arrowright'] || keys['d']) dx = player.speed;
    if (keys['arrowup'] || keys['w']) dy = -player.speed;
    if (keys['arrowdown'] || keys['s']) dy = player.speed;

    player.x += dx;
    player.y += dy;

    // 월드 맵 경계 제한
    player.x = Math.max(20, Math.min(WORLD.width - 20, player.x));
    player.y = Math.max(20, Math.min(WORLD.height - 20, player.y));

    // ★ 핵심: 카메라가 플레이어를 중앙에 두도록 따라감
    camera.x = player.x - camera.width / 2;
    camera.y = player.y - camera.height / 2;

    // 카메라가 월드 맵 밖으로 나가지 않도록 고정
    camera.x = Math.max(0, Math.min(WORLD.width - camera.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD.height - camera.height, camera.y));
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // ★ 핵심: 카메라 위치만큼 좌표계를 이동시켜 스크롤 연출 구현
    ctx.translate(-camera.x, -camera.y);

    // 1. 거대 월드 테두리 및 격자 배경
    ctx.strokeStyle = '#222233';
    ctx.lineWidth = 2;
    for (let x = 0; x <= WORLD.width; x += 50) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.height); ctx.stroke();
    }
    for (let y = 0; y <= WORLD.height; y += 50) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.width, y); ctx.stroke();
    }

    // 맵 외각 테두리
    ctx.strokeStyle = '#00ff66';
    ctx.strokeRect(0, 0, WORLD.width, WORLD.height);

    // 2. 월드 맵 상의 918개 꽃 렌더링 (화면에 보이는 영역만)
    flowers.forEach(f => {
      if (!f.collected) {
        // 화면 최적화 (카메라 바깥의 꽃은 그리지 않음)
        if (f.x > camera.x - 20 && f.x < camera.x + camera.width + 20 &&
            f.y > camera.y - 20 && f.y < camera.y + camera.height + 20) {
          ctx.fillStyle = f.color;
          ctx.fillRect(f.x - 5, f.y - 5, 10, 10);
          ctx.fillStyle = '#fff';
          ctx.fillRect(f.x - 2, f.y - 2, 4, 4);
        }
      }
    });

    // 3. 난쟁이 플레이어 렌더링
    ctx.fillStyle = '#ff5555';
    ctx.fillRect(player.x - 8, player.y - 10, 16, 14);
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(player.x - 6, player.y - 6, 12, 8);
    ctx.fillStyle = '#000';
    ctx.fillRect(player.x - 4, player.y - 4, 2, 2);
    ctx.fillRect(player.x + 2, player.y - 4, 2, 2);

    // 감정 이모션
    if (player.emotionTimer > 0) {
      ctx.fillStyle = '#fff';
      ctx.font = '16px VT323';
      ctx.fillText(player.emotion, player.x + 10, player.y - 14);
      player.emotionTimer--;
    }

    ctx.restore(); // 좌표계 복원
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
