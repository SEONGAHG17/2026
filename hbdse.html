<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C:\> 918_Flowers_Quest.exe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --bg-color: #050505;
      --term-green: #00ff66;
      --term-dim: #008833;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .crt-screen {
      width: 760px;
      height: 560px;
      background: #000;
      border: 4px solid var(--term-dim);
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px dashed var(--term-dim);
      padding-bottom: 8px;
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    canvas {
      background: #0d0d12;
      border: 2px solid var(--term-green);
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
    }

    .dialogue-box {
      margin-top: 10px;
      border: 2px solid var(--term-green);
      background: rgba(0, 20, 0, 0.9);
      padding: 12px;
      height: 85px;
      font-size: 1.25rem;
      line-height: 1.3;
      position: relative;
    }

    .guide {
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 0.85rem;
      color: var(--term-dim);
    }
  </style>
</head>
<body>

<div class="crt-screen">
  <div class="header">
    <span id="roomTitle">ROOM: [ 1번 방 : 시작의 들판 ]</span>
    <span id="flowerCount" style="color: #ffcc00;">[FLOWER: 0 / 918]</span>
  </div>

  <canvas id="gameCanvas" width="700" height="340"></canvas>

  <div class="dialogue-box">
    <div id="dialogueText">방향키로 맵을 이동하고, 문(🚪)에 닿으면 다른 방으로 넘어갑니다! 꽃을 찾아 [Z]를 누르세요.</div>
    <div class="guide">이동: 방향키(WASD) / 채집: Z 또는 Space / 맵 이동: 문(🚪)으로 들어가기</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq = 440, duration = 0.04) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0.03;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  let gameState = 'EXPLORE'; // EXPLORE, MINIGAME, ENDING
  let totalCollected = 0;
  const targetCount = 918;

  // 플레이어 객체
  let player = {
    x: 100,
    y: 170,
    size: 20,
    speed: 3,
    emotion: null,
    emotionTimer: 0
  };

  // 멀티 룸 데이터 구조 (언더테일식 방 이동)
  let currentRoom = 1;
  const rooms = {
    1: {
      name: "1번 방 : 시작의 들판",
      doors: [{ x: 670, y: 150, w: 20, h: 60, targetRoom: 2, targetX: 40, targetY: 170 }],
      flowers: [
        { id: 101, x: 200, y: 100, collected: false, color: '#ff3366' },
        { id: 102, x: 350, y: 250, collected: false, color: '#ffcc00' },
        { id: 103, x: 500, y: 120, collected: false, color: '#33aaff' }
      ]
    },
    2: {
      name: "2번 방 : 안개 낀 꽃밭",
      doors: [
        { x: 10, y: 150, w: 20, h: 60, targetRoom: 1, targetX: 630, targetY: 170 },
        { x: 670, y: 150, w: 20, h: 60, targetRoom: 3, targetX: 40, targetY: 170 }
      ],
      flowers: [
        { id: 201, x: 250, y: 80, collected: false, color: '#ff77ff' },
        { id: 202, x: 400, y: 270, collected: false, color: '#33ffaa' }
      ]
    },
    3: {
      name: "3번 방 : 비밀의 온실 (끝판왕)",
      doors: [{ x: 10, y: 150, w: 20, h: 60, targetRoom: 2, targetX: 630, targetY: 170 }],
      flowers: [
        { id: 301, x: 300, y: 170, collected: false, color: '#ff3333' },
        { id: 302, x: 450, y: 100, collected: false, color: '#ffff33' },
        { id: 303, x: 500, y: 250, collected: false, color: '#33ffff' }
      ]
    }
  };

  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'z'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
    if ((e.key === 'z' || e.key === ' ' || e.key.toLowerCase() === 'z') && gameState === 'EXPLORE') {
      tryGatherFlower();
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function setDialogue(text) {
    document.getElementById('dialogueText').innerText = text;
  }

  // 꽃 채집 시도
  function tryGatherFlower() {
    let room = rooms[currentRoom];
    for (let f of room.flowers) {
      if (!f.collected) {
        let dist = Math.hypot(player.x - f.x, player.y - f.y);
        if (dist < 40) {
          f.collected = true;
          totalCollected += 306; // 3개 방에서 총 8개 정도 돌면 918 채워지도록 설정 세팅 (또는 1개당 115씩 가중치)
          if (totalCollected > targetCount) totalCollected = targetCount;

          document.getElementById('flowerCount').innerText = `[FLOWER: ${totalCollected} / ${targetCount}]`;
          playBeep(880, 0.1);

          player.emotion = '♥';
          player.emotionTimer = 45;

          if (totalCollected >= targetCount) {
            gameState = 'ENDING';
            setDialogue("🎉 918송이의 꽃다발 완벽 채집 성공! 진심으로 생일 축하해!! ✨");
          } else {
            setDialogue(`꽃을 채집했다! 현재 누적: ${totalCollected}송이 / 918송이`);
          }
          return;
        }
      }
    }
  }

  // 맵 이동 체크
  function checkDoors() {
    let room = rooms[currentRoom];
    for (let d of room.doors) {
      if (player.x > d.x && player.x < d.x + d.w && player.y > d.y && player.y < d.y + d.h) {
        currentRoom = d.targetRoom;
        player.x = d.targetX;
        player.y = d.targetY;
        document.getElementById('roomTitle').innerText = `ROOM: [ ${rooms[currentRoom].name} ]`;
        playBeep(400, 0.15);
      }
    }
  }

  // 렌더링 함수들
  function drawPixelDwarf(x, y) {
    ctx.fillStyle = '#ff5555';
    ctx.fillRect(x - 8, y - 10, 16, 14);
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(x - 6, y - 6, 12, 8);
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 4, y - 4, 2, 2);
    ctx.fillRect(x + 2, y - 4, 2, 2);

    if (player.emotionTimer > 0) {
      ctx.fillStyle = '#fff';
      ctx.font = '16px VT323';
      ctx.fillText(player.emotion, x + 10, y - 14);
      player.emotionTimer--;
    }
  }

  function update() {
    if (gameState === 'EXPLORE') {
      let dx = 0, dy = 0;
      if (keys['arrowleft'] || keys['a']) dx = -player.speed;
      if (keys['arrowright'] || keys['d']) dx = player.speed;
      if (keys['arrowup'] || keys['w']) dy = -player.speed;
      if (keys['arrowdown'] || keys['s']) dy = player.speed;

      player.x += dx;
      player.y += dy;

      // 맵 경계 제한
      player.x = Math.max(30, Math.min(670, player.x));
      player.y = Math.max(30, Math.min(310, player.y));

      checkDoors();
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 맵 격자 배경 (언더테일 필드 느낌)
    ctx.strokeStyle = '#151522';
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 35) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for (let j = 0; j < canvas.height; j += 35) {
      ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    if (gameState === 'EXPLORE') {
      let room = rooms[currentRoom];

      // 문(🚪) 그리기
      room.doors.forEach(d => {
        ctx.fillStyle = '#00ff66';
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.fillStyle = '#000';
        ctx.font = '12px VT323';
        ctx.fillText("DOOR", d.x - 2, d.y - 5);
      });

      // 꽃들 그리기
      room.flowers.forEach(f => {
        if (!f.collected) {
          ctx.fillStyle = f.color;
          ctx.fillRect(f.x - 6, f.y - 6, 12, 12);
          ctx.fillStyle = '#fff';
          ctx.fillRect(f.x - 2, f.y - 2, 4, 4);
        }
      });

      // 플레이어 그리기
      drawPixelDwarf(player.x, player.y);
    } else if (gameState === 'ENDING') {
      ctx.fillStyle = '#ffcc00';
      ctx.font = '28px VT323';
      ctx.fillText("🌻 918송이 전설의 꽃다발 완성! 🌻", 140, 140);
      ctx.fillStyle = '#fff';
      ctx.font = '18px VT323';
      ctx.fillText("이 넓은 맵을 돌아다니며 918개를 채우느라 수고했어!", 160, 190);
      ctx.fillText("오늘 세상에서 가장 행복한 생일을 보내길 바라! ✨", 160, 230);
    }
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
