<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C:\> 918_Flowers_9000x9000_World.exe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --bg-color: #050505;
      --term-green: #00ff66;
      --term-dim: #008833;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .crt-screen {
      width: 760px;
      height: 560px;
      background: #000;
      border: 4px solid var(--term-dim);
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px dashed var(--term-dim);
      padding-bottom: 8px;
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    canvas {
      background: #09090e;
      border: 2px solid var(--term-green);
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
    }

    .dialogue-box {
      margin-top: 10px;
      border: 2px solid var(--term-green);
      background: rgba(0, 20, 0, 0.9);
      padding: 12px;
      height: 85px;
      font-size: 1.25rem;
      line-height: 1.3;
      position: relative;
    }

    .guide {
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 0.85rem;
      color: var(--term-dim);
    }
  </style>
</head>
<body>

<div class="crt-screen">
  <div class="header">
    <span id="posDisplay">WORLD: 9000x9000 [POS: 4500, 4500]</span>
    <span id="flowerCount" style="color: #ffcc00;">[FLOWER: 0 / 918]</span>
  </div>

  <canvas id="gameCanvas" width="720" height="360"></canvas>

  <div class="dialogue-box">
    <div id="dialogueText">초거대 9000x9000 맵을 탐험하세요! 꽃에 다가가 [Z]나 [Space]를 누르면 1개씩 채집됩니다.</div>
    <div class="guide">이동: 방향키(WASD) / 채집: Z 또는 Space</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq = 440, duration = 0.04) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0.03;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // 1. 9000 x 9000 초거대 월드 설정
  const WORLD = {
    width: 9000,
    height: 9000
  };

  // 2. 카메라 (화면 해상도: 720 x 360)
  let camera = {
    x: 0,
    y: 0,
    width: canvas.width,
    height: canvas.height
  };

  // 3. 플레이어 (맵 중앙 4500, 4500에서 시작)
  let player = {
    x: 4500,
    y: 4500,
    speed: 5,
    emotion: null,
    emotionTimer: 0
  };

  // 4. 꽃 918개 생성 + 겹침 방지 마진(최소 거리 40px) 로직
  let flowers = [];
  const totalTarget = 918;
  const MIN_MARGIN = 40; // 꽃과 꽃 사이의 최소 마진 거리 (px)
  let collectedCount = 0;

  const flowerColors = ['#ff3366', '#ffcc00', '#33aaff', '#ff77ff', '#33ffaa'];

  function generateFlowers() {
    let attempts = 0;
    while (flowers.length < totalTarget && attempts < 100000) {
      attempts++;
      let candidateX = Math.floor(Math.random() * (WORLD.width - 200)) + 100;
      let candidateY = Math.floor(Math.random() * (WORLD.height - 200)) + 100;

      // 이전 생성된 꽃들과의 마진 거리 검사
      let isTooClose = false;
      for (let f of flowers) {
        let dist = Math.hypot(candidateX - f.x, candidateY - f.y);
        if (dist < MIN_MARGIN) {
          isTooClose = true;
          break;
        }
      }

      // 최소 마진을 만족하면 꽃 추가
      if (!isTooClose) {
        flowers.push({
          id: flowers.length,
          x: candidateX,
          y: candidateY,
          collected: false,
          color: flowerColors[flowers.length % flowerColors.length]
        });
      }
    }
  }

  generateFlowers();

  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'z'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
    if ((e.key === 'z' || e.key === ' ' || e.key.toLowerCase() === 'z')) {
      tryGatherSingleFlower();
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function setDialogue(text) {
    document.getElementById('dialogueText').innerText = text;
  }

  // ★ 가장 가까운 꽃 '단 1개'만 채집하는 로직
  function tryGatherSingleFlower() {
    let nearestFlower = null;
    let minDistance = 45; // 채집 가능한 감지 범위

    for (let f of flowers) {
      if (!f.collected) {
        let dist = Math.hypot(player.x - f.x, player.y - f.y);
        if (dist < minDistance) {
          minDistance = dist;
          nearestFlower = f;
        }
      }
    }

    // 가장 가까운 꽃 1개만 처리
    if (nearestFlower) {
      nearestFlower.collected = true;
      collectedCount++;

      document.getElementById('flowerCount').innerText = `[FLOWER: ${collectedCount} / ${totalTarget}]`;
      playBeep(880, 0.05);

      const emotions = ['♥', '✨', '!', '🎵'];
      player.emotion = emotions[Math.floor(Math.random() * emotions.length)];
      player.emotionTimer = 35;

      if (collectedCount >= totalTarget) {
        setDialogue("🎉 9000x9000 맵의 918송이 꽃을 모두 채집했습니다! 최고의 생일 축하해!! ✨");
      } else {
        setDialogue(`꽃 1송이를 채집했습니다! "${player.emotion}" (누적: ${collectedCount} / ${totalTarget})`);
      }
    }
  }

  function update() {
    let dx = 0, dy = 0;
    if (keys['arrowleft'] || keys['a']) dx = -player.speed;
    if (keys['arrowright'] || keys['d']) dx = player.speed;
    if (keys['arrowup'] || keys['w']) dy = -player.speed;
    if (keys['arrowdown'] || keys['s']) dy = player.speed;

    player.x += dx;
    player.y += dy;

    // 월드 경계 고정
    player.x = Math.max(20, Math.min(WORLD.width - 20, player.x));
    player.y = Math.max(20, Math.min(WORLD.height - 20, player.y));

    // 실시간 좌표 표시
    document.getElementById('posDisplay').innerText = `WORLD: 9000x9000 [POS: ${Math.floor(player.x)}, ${Math.floor(player.y)}]`;

    // 카메라 추적 (플레이어가 화면 중앙에 위치)
    camera.x = player.x - camera.width / 2;
    camera.y = player.y - camera.height / 2;

    camera.x = Math.max(0, Math.min(WORLD.width - camera.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD.height - camera.height, camera.y));
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // 맵 격자 배경
    ctx.strokeStyle = '#181825';
    ctx.lineWidth = 1;
    let startX = Math.floor(camera.x / 60) * 60;
    let startY = Math.floor(camera.y / 60) * 60;
    for (let x = startX; x <= camera.x + camera.width + 60; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + camera.height); ctx.stroke();
    }
    for (let y = startY; y <= camera.y + camera.height + 60; y += 60) {
      ctx.beginPath(); ctx.moveTo(camera.x, y); ctx.lineTo(camera.x + camera.width, y); ctx.stroke();
    }

    // 외곽 테두리
    ctx.strokeStyle = '#00ff66';
    ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, WORLD.width, WORLD.height);

    // 렌더링 최적화: 현재 화면 카메라 영역 안의 꽃만 그리기
    flowers.forEach(f => {
      if (!f.collected) {
        if (f.x > camera.x - 30 && f.x < camera.x + camera.width + 30 &&
            f.y > camera.y - 30 && f.y < camera.y + camera.height + 30) {
          
          // 픽셀 꽃 렌더링
          ctx.fillStyle = f.color;
          ctx.fillRect(f.x - 6, f.y - 6, 12, 12);
          ctx.fillStyle = '#fff';
          ctx.fillRect(f.x - 2, f.y - 2, 4, 4);
          ctx.fillStyle = '#228822';
          ctx.fillRect(f.x - 1, f.y + 6, 2, 6);
        }
      }
    });

    // 난쟁이 플레이어 렌더링
    ctx.fillStyle = '#ff5555';
    ctx.fillRect(player.x - 8, player.y - 10, 16, 14);
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(player.x - 6, player.y - 6, 12, 8);
    ctx.fillStyle = '#000';
    ctx.fillRect(player.x - 4, player.y - 4, 2, 2);
    ctx.fillRect(player.x + 2, player.y - 4, 2, 2);

    // 채집 시 이모션
    if (player.emotionTimer > 0) {
      ctx.fillStyle = '#fff';
      ctx.font = '16px VT323';
      ctx.fillText(player.emotion, player.x + 10, player.y - 14);
      player.emotionTimer--;
    }

    ctx.restore();
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
