<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C:\> Isometric_918_Flowers.exe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --bg-color: #050505;
      --term-green: #00ff66;
      --term-dim: #008833;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .crt-screen {
      width: 760px;
      height: 560px;
      background: #000;
      border: 4px solid var(--term-dim);
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 20;
      pointer-events: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px dashed var(--term-dim);
      padding-bottom: 8px;
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    canvas {
      background: #09090e;
      border: 2px solid var(--term-green);
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
    }

    .dialogue-box {
      margin-top: 10px;
      border: 2px solid var(--term-green);
      background: rgba(0, 20, 0, 0.9);
      padding: 12px;
      height: 85px;
      font-size: 1.25rem;
      line-height: 1.3;
      position: relative;
    }

    .guide {
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 0.85rem;
      color: var(--term-dim);
    }
  </style>
</head>
<body>

<div class="crt-screen">
  <div class="header">
    <span id="posDisplay">ISOMETRIC WORLD [9000x9000]</span>
    <span id="flowerCount" style="color: #ffcc00;">[FLOWER: 0 / 918]</span>
  </div>

  <canvas id="gameCanvas" width="720" height="360"></canvas>

  <div class="dialogue-box">
    <div id="dialogueText">아이소메트릭 쿼터뷰 월드 탐험 시작! 꽃에 다가가 [Z] 또는 [Space]를 누르세요.</div>
    <div class="guide">이동: 방향키(WASD) / 채집: Z 또는 Space</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq = 440, duration = 0.04) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0.03;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // 1. 월드 크기 정의 (9000 x 9000)
  const WORLD = {
    width: 9000,
    height: 9000
  };

  let camera = {
    x: 0,
    y: 0,
    width: canvas.width,
    height: canvas.height
  };

  let player = {
    x: 4500,
    y: 4500,
    speed: 5,
    emotion: null,
    emotionTimer: 0
  };

  let flowers = [];
  const totalTarget = 918;
  const MIN_MARGIN = 60; // 아이소메트릭 입체감을 위한 마진 확보
  let collectedCount = 0;

  const flowerColors = ['#ff3366', '#ffcc00', '#33aaff', '#ff77ff', '#33ffaa'];

  function generateFlowers() {
    let attempts = 0;
    while (flowers.length < totalTarget && attempts < 150000) {
      attempts++;
      let candidateX = Math.floor(Math.random() * (WORLD.width - 300)) + 150;
      let candidateY = Math.floor(Math.random() * (WORLD.height - 300)) + 150;

      let isTooClose = false;
      for (let f of flowers) {
        let dist = Math.hypot(candidateX - f.x, candidateY - f.y);
        if (dist < MIN_MARGIN) {
          isTooClose = true;
          break;
        }
      }

      if (!isTooClose) {
        flowers.push({
          id: flowers.length,
          x: candidateX,
          y: candidateY,
          collected: false,
          color: flowerColors[flowers.length % flowerColors.length]
        });
      }
    }
  }

  generateFlowers();

  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'z'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
    if ((e.key === 'z' || e.key === ' ' || e.key.toLowerCase() === 'z')) {
      tryGatherSingleFlower();
    }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function setDialogue(text) {
    document.getElementById('dialogueText').innerText = text;
  }

  function tryGatherSingleFlower() {
    let nearestFlower = null;
    let minDistance = 55;

    for (let f of flowers) {
      if (!f.collected) {
        let dist = Math.hypot(player.x - f.x, player.y - f.y);
        if (dist < minDistance) {
          minDistance = dist;
          nearestFlower = f;
        }
      }
    }

    if (nearestFlower) {
      nearestFlower.collected = true;
      collectedCount++;

      document.getElementById('flowerCount').innerText = `[FLOWER: ${collectedCount} / ${totalTarget}]`;
      playBeep(880, 0.05);

      const emotions = ['♥', '✨', '!', '🎵'];
      player.emotion = emotions[Math.floor(Math.random() * emotions.length)];
      player.emotionTimer = 35;

      if (collectedCount >= totalTarget) {
        setDialogue("🎉 9000x9000 아이소메트릭 맵의 918송이 꽃을 완벽 채집했습니다! 생일 축하해!! ✨");
      } else {
        setDialogue(`꽃 1송이를 채집했습니다! "${player.emotion}" (누적: ${collectedCount} / ${totalTarget})`);
      }
    }
  }

  function update() {
    let dx = 0, dy = 0;
    if (keys['arrowleft'] || keys['a']) dx = -player.speed;
    if (keys['arrowright'] || keys['d']) dx = player.speed;
    if (keys['arrowup'] || keys['w']) dy = -player.speed;
    if (keys['arrowdown'] || keys['s']) dy = player.speed;

    player.x += dx;
    player.y += dy;

    player.x = Math.max(50, Math.min(WORLD.width - 50, player.x));
    player.y = Math.max(50, Math.min(WORLD.height - 50, player.y));

    document.getElementById('posDisplay').innerText = `ISO WORLD [POS: ${Math.floor(player.x)}, ${Math.floor(player.y)}]`;

    // 카메라 추적
    camera.x = player.x - camera.width / 2;
    camera.y = player.y - camera.height / 2;

    camera.x = Math.max(0, Math.min(WORLD.width - camera.width, camera.x));
    camera.y = Math.max(0, Math.min(WORLD.height - camera.height, camera.y));
  }

  // ★ 아이소메트릭 2D 변환 함수 (세계 좌표 -> 화면 픽셀 좌표)
  // 2:1 비율 사선 투영법 적용
  function toScreen(worldX, worldY) {
    let screenX = (worldX - worldY) + camera.width / 2 + 1000;
    let screenY = (worldX + worldY) / 2 - 1500;
    return { x: screenX, y: screenY };
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 아이소메트릭 그리드 및 오브젝트는 Y축(화면 상하 위치) 기준 깊이 정렬(Z-index 순서) 필요
    // 렌더링 리스트 작성
    let renderList = [];

    // 1. 카메라 화면 안에 들어오는 꽃들 필터링 후 리스트에 추가
    flowers.forEach(f => {
      if (!f.collected) {
        if (f.x > camera.x - 300 && f.x < camera.x + camera.width + 300 &&
            f.y > camera.y - 300 && f.y < camera.y + camera.height + 300) {
          renderList.push({ type: 'flower', x: f.x, y: f.y, obj: f });
        }
      }
    });

    // 2. 플레이어 추가
    renderList.push({ type: 'player', x: player.x, y: player.y });

    // ★ 깊이 정렬 (Y 좌표가 아래에 있을수록 화면 아래에 그려져야 하므로 오름차순 정렬)
    renderList.sort((a, b) => (a.x + a.y) - (b.x + b.y));

    // 배경 마름모 격자 타일 렌더링
    ctx.strokeStyle = '#141422';
    ctx.lineWidth = 1;
    
    // 렌더링 루프
    renderList.forEach(item => {
      let pos = toScreen(item.x, item.y);

      // 화면 범위 체크
      if (pos.x > -100 && pos.x < canvas.width + 100 && pos.y > -100 && pos.y < canvas.height + 100) {
        if (item.type === 'flower') {
          let f = item.obj;
          // 아이소메트릭 꽃 도트 렌더링
          ctx.fillStyle = f.color;
          ctx.fillRect(pos.x - 5, pos.y - 12, 10, 10);
          ctx.fillStyle = '#fff';
          ctx.fillRect(pos.x - 2, pos.y - 9, 4, 4);
          ctx.fillStyle = '#228822'; // 줄기
          ctx.fillRect(pos.x - 1, pos.y - 2, 2, 6);
        } else if (item.type === 'player') {
          // 아이소메트릭 난쟁이 캐릭터 렌더링
          ctx.fillStyle = '#ff5555'; // 모자/옷
          ctx.fillRect(pos.x - 8, pos.y - 20, 16, 16);
          ctx.fillStyle = '#ffcc99'; // 얼굴
          ctx.fillRect(pos.x - 6, pos.y - 15, 12, 10);
          ctx.fillStyle = '#000';    // 눈
          ctx.fillRect(pos.x - 4, pos.y - 12, 2, 2);
          ctx.fillRect(pos.x + 2, pos.y - 12, 2, 2);

          // 감정 이모션
          if (player.emotionTimer > 0) {
            ctx.fillStyle = '#fff';
            ctx.font = '16px VT323';
            ctx.fillText(player.emotion, pos.x + 10, pos.y - 26);
            player.emotionTimer--;
          }
        }
      }
    });
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
